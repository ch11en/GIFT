[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gift-model"
version = "0.1.0"
description = "Core GIFT model, target-aware calibration, and utility-risk calibration."
requires-python = ">=3.9"
dependencies = ["torch>=2.0"]

[tool.setuptools.packages.find]
include = ["gift*"]
